[project]
name = "gerenciador-prompts"
version = "0.1.0"
description = "Servidor MCP do Gerenciador de Prompts da Fashion Co."
readme = "README.md"
authors = [
    { name = "brevvi", email = "brevvi@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
gerenciador-prompts = "gerenciador_prompts:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
